name: Refresh Australian development news

on:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/refresh-news.yml"
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-development-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate published RSS headlines
        run: python3 scripts/update_news.py

      - name: Commit updated headline index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No headlines changed"
          else
            git commit -m "Refresh Canberra and Australian development news"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
